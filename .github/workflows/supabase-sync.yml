name: Supabase CI/CD

# Two Supabase projects, one per environment:
#   develop -> QA   (GitHub environment "qa")
#   main    -> PRD  (GitHub environment "production", give it required reviewers)
#
# Each GitHub environment holds its own SUPABASE_PROJECT_ID and
# SUPABASE_DB_PASSWORD secrets. SUPABASE_ACCESS_TOKEN is a single repository
# secret for the Supabase account that owns both projects.
# Setup steps: docs/environments.md

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to push migrations to (production only runs from main)
        type: choice
        options: [qa, production]
        required: true

# Pull request runs can be superseded; a deploy must never be cancelled halfway
# through a db push.
concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Replays every migration on an empty database, the same path a brand-new
  # project takes. Runs on PRs into develop and main, and gates both deploys.
  test-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Migrations
        run: |
          supabase start
          supabase db reset

  deploy-qa:
    needs: test-migrations
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'qa')
    runs-on: ubuntu-latest
    environment: qa
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link QA project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push Database Migrations
        run: supabase db push

  deploy-production:
    needs: test-migrations
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    # Required reviewers on this environment pause the run here until approved.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: List pending migrations
        run: |
          {
            echo '### Migrations about to be applied to production'
            echo '```'
            supabase db push --dry-run 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push Database Migrations
        run: supabase db push
