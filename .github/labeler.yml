      - any-glob-to-any-file: ['src/**', 'index.html', 'vite.config.js']

database:
  - changed-files:
      - any-glob-to-any-file: 'supabase/**'

android:
  - changed-files:
      - any-glob-to-any-file: ['android/**', 'capacitor.config.json']

ci:
